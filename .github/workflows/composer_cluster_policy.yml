# This is a basic workflow to help you get started with Actions

name: Composer Cluster Policy CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for changes to the composer_cluster_policy directory
  push:
    branches: ["main"]
    paths: ["composer_cluster_policy/**", ".github/workflows/composer_cluster_policy.yml"]
  pull_request:
    branches: ["main"]
    paths: ["composer_cluster_policy/**", ".github/workflows/composer_cluster_policy.yml"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: "ruff lint and format checks"
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check formatting with ruff
        run: |
          uv run --project composer_cluster_policy --extra dev ruff format --check composer_cluster_policy

      - name: Lint with ruff
        run: |
          uv run --project composer_cluster_policy --extra dev ruff check composer_cluster_policy

  test:
    name: "run pytest"
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Test with pytest
        run: |
          pytest composer_cluster_policy/tests/
